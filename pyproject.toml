[project]
name = "perf-lab"
version = "0.1.0"
description = "LLM inference performance lab: KV cache, quantization, attention kernels, and reproducible benchmarks"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
gpu = ["triton>=3.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perf_lab", "triton_kernels"]
